[project]

[project.scripts]
logsift = "logsift_3.cli:main"

name = "logsift-3"
version = "0.1.0"
description = "A streaming CLI filter that strips noise, redacts PII, and structures messy unstructured stdout logs into clean JSON for rapid grep analysis."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logsift_3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
