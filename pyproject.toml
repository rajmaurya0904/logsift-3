[project]

[project.scripts]
logsift = "logsift_3.cli:main"

name = "logsift-3"
version = "0.1.0"
description = "A streaming CLI filter that strips noise, redacts PII, and structures messy unstructured stdout logs into clean JSON for rapid grep analysis."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.flake8]
max-line-length = 88
ignore = "E203,W503"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logsift_3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[project.optional-dependencies]
# Development dependencies for linting and testing
# These are installed in CI and for local development
# to run mypy, flake8, and pytest
# Note: ruff is also included for linting
# but the CI workflow uses flake8 and mypy
# as per the task requirement

dev = ["mypy", "flake8", "pytest", "ruff"]
